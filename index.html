
<style>
#titanOpenProducts {
  width: 100%;
  min-height: 165px;
  padding: 25px;
  background: #144c38;
  color: white;
  border: none;
  border-radius: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  font-size: 23px;
  font-weight: 850;
  cursor: pointer;
  box-shadow: 0 8px 22px #144c3820;
}

#titanOpenProducts small {
  font-size: 13px;
  font-weight: 400;
  color: #d9f2e2;
}

#titanProductPopup {
  width: min(780px, calc(100% - 20px));
  max-height: calc(100dvh - 30px);
  border: none;
  border-radius: 20px;
  padding: 0;
  overflow-y: auto;
  background: white;
  box-shadow: 0 20px 60px #0004;
}

#titanProductPopup::backdrop {
  background: #071d14b8;
  backdrop-filter: blur(4px);
}

#titanProductPopup > .panel {
  border: none;
  border-radius: 0;
  box-shadow: none;
}

.titan-picker-bar {
  position: sticky;
  top: 0;
  z-index: 10;
  background: white;
  padding: 14px 20px;
  border-bottom: 1px solid #e5ebe5;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-weight: 800;
}

#titanCloseProducts {
  border: none;
  border-radius: 10px;
  background: #edf3ef;
  padding: 10px 15px;
  color: #144c38;
  font-weight: 800;
  cursor: pointer;
}
</style>

<script>
(() => {
  const catalog = document.querySelector(
    "main.dashboard > section.panel"
  );

  if (!catalog) return;

  const button = document.createElement("button");
  button.type = "button";
  button.id = "titanOpenProducts";
  button.innerHTML = `
    <span>📦 เลือกสินค้า</span>
    <small>แตะเพื่อเลือกไซส์กล่องและดูราคา</small>
  `;

  const popup = document.createElement("dialog");
  popup.id = "titanProductPopup";

  const bar = document.createElement("div");
  bar.className = "titan-picker-bar";
  bar.innerHTML = `
    <span>📦 รายการสินค้า</span>
    <button id="titanCloseProducts" type="button">
      ✕ ปิด
    </button>
  `;

  catalog.parentNode.insertBefore(button, catalog);

  popup.appendChild(bar);
  popup.appendChild(catalog);
  document.body.appendChild(popup);

  button.addEventListener("click", () => {
    popup.showModal();
  });

  document.getElementById("titanCloseProducts")
    .addEventListener("click", () => {
      popup.close();
    });

  popup.addEventListener("click", (event) => {
    if (event.target === popup) {
      popup.close();
    }
  });

  catalog.addEventListener("click", (event) => {
    const target = event.target.closest(
      "button[data-action]"
    );

    if (!target) return;

    if (
      target.dataset.action === "add" ||
      target.dataset.action === "edit"
    ) {
      popup.close();
    }
  });
})();
</script>
