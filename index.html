
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#166534">
<title>Titan Packaging</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f7f4;color:#183c2c;font-family:system-ui,sans-serif}
header{background:#166534;color:white;padding:20px}
header h1{margin:0;font-size:24px}
small{display:block;font-size:11px;font-weight:400;opacity:.75}
main{max-width:850px;margin:auto;padding:15px}
.panel{background:white;border-radius:16px;padding:18px;margin:15px 0;box-shadow:0 2px 10px #0001}
h2{font-size:19px;margin-top:0}
button{background:#166534;color:white;border:0;border-radius:10px;padding:12px;cursor:pointer;font:inherit}
button.secondary{background:#e6eee7;color:#166534}
input,select{width:100%;padding:12px;border:1px solid #ccd8cf;border-radius:9px;font:inherit;margin:6px 0 12px}
label{font-size:14px;font-weight:600}
nav{display:flex;gap:8px;margin-top:15px}
nav button{flex:1;background:#ffffff22}
nav button.active{background:white;color:#166534}
.categories{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.category{background:#edf5ef;color:#166534;min-height:95px}
.category.active{background:#166534;color:white}
.category span{display:block;font-size:27px}
.item{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid #eee;padding:13px 0}
.item strong{display:block}
.item small{color:#65776b}
.item button{flex-shrink:0}
.total{background:#edf5ef;border-radius:12px;padding:18px;display:flex;justify-content:space-between;font-weight:bold}
.total b{font-size:23px}
.qty{width:68px;margin:0}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.hidden{display:none!important}
.notice{font-size:13px;color:#61796a}
.error{color:#b42318}
@media(min-width:700px){.categories{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header>
<h1>📦 TITAN PACKAGING</h1>
<small>Packaging Price Calculator</small>
<nav>
<button id="customerTab" class="active" onclick="showPage('customer')">หน้าลูกค้า<small>Customer</small></button>
<button id="adminTab" onclick="showPage('admin')">ผู้ดูแล<small>Admin</small></button>
</nav>
</header>
<main>
<section id="customerPage">
<div class="panel">
<h2>เลือกประเภทสินค้า <small>Product Categories</small></h2>
<div class="categories" id="categories"></div>
</div>
<div class="panel">
<h2>ค้นหาสินค้า <small>Search Products</small></h2>
<input id="search" placeholder="🔎 ชื่อสินค้า / Product name" oninput="renderProducts()">
<p class="notice" id="status">กำลังโหลดข้อมูล...</p>
<div id="products"></div>
</div>
<div class="panel">
<h2>🛒 รายการที่ซื้อ <small>Shopping Cart</small></h2>
<div id="cart"></div>
<div class="total"><span>ยอดรวม <small>Total</small></span><b id="total">฿0.00</b></div>
<div class="actions" style="margin-top:15px">
<button onclick="copyCart()">คัดลอกรายการ <small>Copy Summary</small></button>
<button class="secondary" onclick="cart={};renderCart()">ล้างรายการ <small>Clear Cart</small></button>
</div>
</div>
</section>

<section id="adminPage" class="hidden">
<div id="loginPanel" class="panel">
<h2>เข้าสู่ระบบผู้ดูแล <small>Admin Login</small></h2>
<form id="loginForm">
<label>อีเมล / Email</label>
<input id="email" type="email" required>
<label>รหัสผ่าน / Password</label>
<input id="password" type="password" required>
<button type="submit">เข้าสู่ระบบ / Sign In</button>
</form>
</div>
<div id="editorPanel" class="hidden">
<div class="panel">
<h2>⚙️ จัดการสินค้า <small>Manage Products</small></h2>
<button class="secondary" onclick="logout()">ออกจากระบบ / Logout</button>
<form id="productForm">
<input type="hidden" id="editId">
<label>ประเภทสินค้า / Category</label>
<select id="category">
<option value="box">📦 กล่อง / Boxes</option>
<option value="tape">🧻 เทปกาว / Tape</option>
<option value="bubble">🫧 บับเบิ้ล / Bubble Wrap</option>
<option value="mailer">✉️ ซองไปรษณีย์ / Mailers</option>
</select>
<label>ชื่อสินค้า / Product Name</label>
<input id="name" required maxlength="120">
<label>ราคา (บาท) / Price (THB)</label>
<input id="price" type="number" min="0" step="0.01" required>
<label>หน่วย / Unit</label>
<input id="unit" placeholder="ชิ้น / ม้วน / แพ็ก" required maxlength="40">
<label>สีเทปกาว / Tape Color</label>
<select id="color">
<option value="">ไม่ระบุ / None</option>
<option value="ใส">ใส / Clear</option>
<option value="น้ำตาล">น้ำตาล / Brown</option>
<option value="แดง">แดง / Red</option>
<option value="น้ำเงิน">น้ำเงิน / Blue</option>
<option value="เขียว">เขียว / Green</option>
<option value="เหลือง">เหลือง / Yellow</option>
<option value="ดำ">ดำ / Black</option>
<option value="ขาว">ขาว / White</option>
</select>
<div class="actions">
<button type="submit">บันทึก / Save</button>
<button type="button" class="secondary" onclick="resetForm()">ล้างฟอร์ม / Reset</button>
</div>
</form>
</div>
<div class="panel">
<h2>รายการสินค้า <small>Product List</small></h2>
<div id="adminProducts"></div>
</div>
</div>
<p id="adminMessage" class="notice"></p>
</section>
</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import {getFirestore,collection,onSnapshot,addDoc,updateDoc,deleteDoc,doc,serverTimestamp}
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut}
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

// ใส่ Firebase Config ของคุณตรงนี้
const firebaseConfig={
 apiKey:"YOUR_API_KEY",
 authDomain:"YOUR_PROJECT_ID.firebaseapp.com",
 projectId:"YOUR_PROJECT_ID",
 storageBucket:"YOUR_PROJECT_ID.firebasestorage.app",
 messagingSenderId:"YOUR_SENDER_ID",
 appId:"YOUR_APP_ID"
};

const ADMIN="mr.surasak.kitisak@gmail.com";
const $=id=>document.getElementById(id);
const money=n=>"฿"+Number(n).toLocaleString("th-TH",{minimumFractionDigits:2,maximumFractionDigits:2});
const cats=[
 ["box","📦","กล่อง","Boxes"],
 ["tape","🧻","เทปกาว","Tape"],
 ["bubble","🫧","บับเบิ้ล","Bubble Wrap"],
 ["mailer","✉️","ซองไปรษณีย์","Mailers"]
];
let products=[],cart={},active="box",auth=null,db=null;
let adminUnsub=null;
const validAdmin=u=>u&&u.email===ADMIN&&u.emailVerified;
const escapeHTML=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

window.showPage=page=>{
 $("customerPage").classList.toggle("hidden",page!=="customer");
 $("adminPage").classList.toggle("hidden",page!=="admin");
 $("customerTab").classList.toggle("active",page==="customer");
 $("adminTab").classList.toggle("active",page==="admin");
};

function renderCategories(){
 $("categories").innerHTML=cats.map(c=>`
 <button class="category ${active===c[0]?"active":""}" data-cat="${c[0]}">
 <span>${c[1]}</span>${c[2]}<small>${c[3]}</small></button>`).join("");
 document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{
 active=b.dataset.cat;renderCategories();renderProducts();
 });
}
window.renderProducts=()=>{
 const q=$("search").value.trim().toLowerCase();
 const list=products.filter(p=>p.category===active&&p.name.toLowerCase().includes(q));
 $("products").innerHTML=list.length?list.map(p=>`
 <div class="item">
 <div><strong>${escapeHTML(p.name)}</strong>
 <small>${escapeHTML(p.color||"")} ${money(p.price)} / ${escapeHTML(p.unit)}</small></div>
 <button data-add="${p.id}">+ เพิ่ม<small>Add</small></button>
 </div>`).join(""):"<p class='notice'>ยังไม่มีสินค้า / No products</p>";
 document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{
 cart[b.dataset.add]=(cart[b.dataset.add]||0)+1;renderCart();
 });
};
window.renderCart=()=>{
 let sum=0;
 $("cart").innerHTML=Object.entries(cart).map(([id,qty])=>{
 const p=products.find(x=>x.id===id);
 if(!p)return "";
 sum+=p.price*qty;
 return `<div class="item"><div><strong>${escapeHTML(p.name)}</strong>
 <small>${money(p.price)} × ${qty} = ${money(p.price*qty)}</small></div>
 <input class="qty" type="number" min="0" step="1" value="${qty}" data-qty="${id}">
 <button class="secondary" data-remove="${id}">×</button></div>`;
 }).join("")||"<p class='notice'>ยังไม่มีสินค้า / Cart is empty</p>";
 $("total").textContent=money(sum);
 document.querySelectorAll("[data-qty]").forEach(e=>e.onchange=()=>{
 const n=Math.max(0,Math.floor(Number(e.value)||0));
 if(n)cart[e.dataset.qty]=n;else delete cart[e.dataset.qty];
 renderCart();
 });
 document.querySelectorAll("[data-remove]").forEach(e=>e.onclick=()=>{
 delete cart[e.dataset.remove];renderCart();
 });
};
window.copyCart=async()=>{
 const lines=["TITAN PACKAGING"];let total=0;
 for(const [id,qty] of Object.entries(cart)){
 const p=products.find(x=>x.id===id);if(!p)continue;
 total+=p.price*qty;
 lines.push(`${p.name} × ${qty} = ${money(p.price*qty)}`);
 }
 lines.push("ยอดรวม / Total: "+money(total));
 try{await navigator.clipboard.writeText(lines.join("\n"));alert("คัดลอกแล้ว / Copied")}
 catch{prompt("คัดลอกรายการ / Copy",lines.join("\n"))}
};
window.resetForm=()=>{$("productForm").reset();$("editId").value=""};
window.logout=()=>signOut(auth);
function adminMessage(t){$("adminMessage").textContent=t}
function renderAdmin(){
 $("adminProducts").innerHTML=products.length?products.map(p=>`
 <div class="item"><div><strong>${escapeHTML(p.name)}</strong>
 <small>${money(p.price)} / ${escapeHTML(p.unit)} · ${escapeHTML(p.color||"")}</small></div>
 <button data-edit="${p.id}">แก้ไข</button>
 <button class="secondary" data-delete="${p.id}">ลบ</button></div>`).join(""):"<p class='notice'>ยังไม่มีสินค้า / No products</p>";
 document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{
 const p=products.find(x=>x.id===b.dataset.edit);if(!p)return;
 ["category","name","price","unit","color"].forEach(k=>$(k).value=p[k]??"");
 $("editId").value=p.id;window.scrollTo({top:0,behavior:"smooth"});
 });
 document.querySelectorAll("[data-delete]").forEach(b=>b.onclick=async()=>{
 if(!validAdmin(auth.currentUser))return;
 if(!confirm("ยืนยันลบสินค้านี้?"))return;
 try{await deleteDoc(doc(db,"products",b.dataset.delete))}
 catch(e){adminMessage(e.message)}
 });
}
$("loginForm").onsubmit=async e=>{
 e.preventDefault();
 if(!auth)return adminMessage("ยังไม่ได้ตั้งค่า Firebase");
 try{await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value)}
 catch(e){adminMessage("เข้าสู่ระบบไม่สำเร็จ: "+e.message)}
};
$("productForm").onsubmit=async e=>{
 e.preventDefault();
 if(!validAdmin(auth?.currentUser))return adminMessage("ไม่มีสิทธิ์จัดการสินค้า");
 const price=Number($("price").value);
 if(!Number.isFinite(price)||price<0)return;
 const payload={
 category:$("category").value,
 name:$("name").value.trim(),
 price,
 unit:$("unit").value.trim(),
 color:$("category").value==="tape"?$("color").value:"",
 updatedAt:serverTimestamp()
 };
 if(!payload.name||!payload.unit)return;
 try{
 const id=$("editId").value;
 if(id)await updateDoc(doc(db,"products",id),payload);
 else await addDoc(collection(db,"products"),payload);
 resetForm();adminMessage("บันทึกสินค้าเรียบร้อย");
 }catch(e){adminMessage("บันทึกไม่สำเร็จ: "+e.message)}
};
renderCategories();renderProducts();renderCart();
if(firebaseConfig.apiKey==="YOUR_API_KEY"){
 $("status").textContent="⚠️ กรุณาตั้งค่า Firebase ก่อนใช้งาน";
}else{
 try{
 const app=initializeApp(firebaseConfig);
 db=getFirestore(app);auth=getAuth(app);
 onSnapshot(collection(db,"products"),snapshot=>{
 products=snapshot.docs.map(d=>({id:d.id,...d.data()}));
 $("status").textContent=`● เชื่อมต่อแล้ว / Live · ${products.length} รายการ`;
 renderProducts();renderCart();renderAdmin();
 },e=>$("status").textContent="เชื่อมต่อข้อมูลไม่ได้: "+e.message);
 onAuthStateChanged(auth,u=>{
 const ok=validAdmin(u);
 $("loginPanel").classList.toggle("hidden",ok);
 $("editorPanel").classList.toggle("hidden",!ok);
 if(u&&!ok){adminMessage("บัญชีไม่ได้รับอนุญาตหรือยังไม่ยืนยันอีเมล");signOut(auth)}
 });
 }catch(e){$("status").textContent="Firebase Error: "+e.message}
}
</script>
</body>
</html>
